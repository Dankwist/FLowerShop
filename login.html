
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FlowerShop</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./icons/favicon-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
    <nav>
        <div class="left-nav">
            <h2><span class="orange-logo">Flower</span>Shop</h2>
        </div>
        <div class="center-nav">
            <a href="./index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="">Blog</a>
            <a href="">About</a>
        </div>
        <div class="right-nav">
            <a href="./login.html"><img src="./icons/profile-icon.png" alt="profile"></a>
            <a href="./cart.html"><img src="./icons/cart-icon.png" alt="cart"></a>
        </div>
    </nav>

    <main class="auth-page">
        <form class="auth-form" id="login-form">
            <h1>Login</h1>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <a href="#" id="forgot-password">Forgot password?</a>
            <p id="auth-message"></p>
            <p>
                Don't have an account?
                <a href="./register.html">Register</a>
            </p>
        </form>
    </main>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
