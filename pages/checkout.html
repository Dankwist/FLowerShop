<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FlowerShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="shortcut icon" href="../icons/favicon-logo.png" type="image/x-icon">
</head>
<body>
    <nav>
        <div class="left-nav">
            <h2><span class="orange-logo">Flower</span>Shop</h2>
        </div>

        <div class="center-nav">
            <a href="./index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="">Blog</a>
            <a href="">About</a>
             <a href="./admin.html" id="admin-link" style="display: none;"> Admin </a>
        </div>

        <div class="right-nav">
            <a href="./profile.html" id="profile-link"></a>
            <a href="./cart.html">
                <img src="../icons/cart-icon.png" alt="cart">
            </a>
        </div>
    </nav>

    <main class="checkout-page">
        <div class="checkout-box">
            <p class="checkout-label">FLOWERSHOP</p>
            <h1>Checkout</h1>

            <div id="checkout-items"></div>

            <div class="checkout-total">
                <span>Total</span>
                <strong id="checkout-total">$0</strong>
            </div>

            <button id="place-order">Place order</button>
            <a href="./cart.html">← Back to cart</a>

            <p id="checkout-message"></p>
        </div>
    </main>

    <script type="module" src="../js/checkout.js"></script>
    <script type="module" src="../js/user-nav.js"></script>
</body>
</html>
