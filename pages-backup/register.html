<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FlowerShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="shortcut icon" href="../icons/favicon-logo.png" type="image/x-icon">
</head>
<body>
    <nav>
        <div class="left-nav">
            <h2><span class="orange-logo">Flower</span>Shop</h2>
        </div>
        <div class="center-nav">
            <a href="./index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="./blog.html">Blog</a>
            <a href="./about.html">About</a>
        </div>
        <div class="right-nav">
            <a href="./login.html"><img src="../icons/profile-icon.png" alt="profile"></a>
            <a href="./cart.html"><img src="../icons/cart-icon.png" alt="cart"></a>
        </div>
    </nav>

    <main class="auth-page">
        <form class="auth-form" id="register-form">
            <h1>Create account</h1>
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
            <p id="auth-message"></p>
            <p>
                Already have an account?
                <a href="./login.html">Login</a>
            </p>
        </form>
    </main>

    <script type="module" src="../js/register.js"></script>
</body>
</html>
